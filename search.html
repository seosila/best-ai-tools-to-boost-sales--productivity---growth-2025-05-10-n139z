<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | AI Tools Directory</title>
    <meta name="description" content="Search the limited SellBetterAI directory of AI tools.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://sellbetterai.com/search.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="fixed w-full bg-white/90 backdrop-blur-sm z-50 border-b border-gray-100">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="https://sellbetterai.com/" class="text-2xl font-bold bg-gradient-to-r from-purple-600 to-blue-500 bg-clip-text text-transparent">SellBetterAI</a>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-16">
        <h1 class="text-3xl font-bold mb-6">Search Results</h1>
        <p class="text-gray-600 mb-6">Limited search: one tool profile is currently listed.</p>
        <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
        <p class="mt-8"><a href="tools.html" class="text-purple-700 hover:underline">Browse the directory</a></p>
    </main>

    <footer class="bg-gray-900 text-gray-300 py-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 AI Directory. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const query = new URLSearchParams(window.location.search).get('query');
        const resultsContainer = document.getElementById('search-results');
        const tool = {
            name: 'ChatGPT',
            url: 'tools/chatbots-and-virtual-agents/chatgpt/',
            description: 'AI assistant developed by OpenAI.'
        };

        if (!query || !query.trim()) {
            resultsContainer.textContent = 'Enter a search term on the homepage to search the limited directory.';
        } else if (`${tool.name} ${tool.description} chatbot`.toLowerCase().includes(query.trim().toLowerCase())) {
            const card = document.createElement('article');
            card.className = 'bg-white rounded-xl shadow-lg border border-gray-100 p-6';
            const heading = document.createElement('h2');
            heading.className = 'text-xl font-semibold mb-2';
            heading.textContent = tool.name;
            const description = document.createElement('p');
            description.className = 'text-gray-600 mb-4';
            description.textContent = tool.description;
            const link = document.createElement('a');
            link.className = 'inline-block bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition duration-300';
            link.href = tool.url;
            link.textContent = 'View Tool';
            card.append(heading, description, link);
            resultsContainer.appendChild(card);
        } else {
            resultsContainer.textContent = `No listed tools matched "${query}".`;
        }
    </script>
</body>
</html>
